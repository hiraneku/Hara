# SALIN berkas ini ke .github/workflows/apk.yml (lihat docs/deploy/APK.md).
# Logika build ada di android/scripts/ci-build.sh, jadi berkas ini jarang berubah.
name: Build APK Hara

on:
  push:
    branches: [arena/c3f71ef0-hara, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependency
        run: npm ci

      - name: Salin docs/ ke proyek Android
        run: npx cap sync android

      - name: Build APK
        env:
          HARA_SEED: ${{ secrets.HARA_SEED }}
          GH_TOKEN: ${{ github.token }}
        run: bash android/scripts/ci-build.sh

      - name: Unggah APK dan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hara-apk-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/hara-out/Hara.apk
            ${{ runner.temp }}/hara-out/build-log.txt
          if-no-files-found: warn
