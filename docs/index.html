<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hara — Prototipe Desain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ─────────────  TOKEN  ───────────── */
:root{
  --bg:#FBFAF8; --surface:#FFFFFF; --sunken:#F3F1ED;
  --border:#E6E2DB; --border-strong:#D4CFC5;
  --text:#1C1B18; --muted:#6B675F; --faint:#9A958B;
  --accent:#3F6F5B; --accent-weak:#E8F0EB; --danger:#A34434;
  --m-notes:#3F6F5B; --m-rem:#B5723A; --m-task:#4A6B8A;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --shadow-pop:0 4px 16px rgba(28,27,24,.08);
  --shadow-modal:0 16px 48px rgba(28,27,24,.16);
  --ease:cubic-bezier(.2,.6,.2,1);
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
}
[data-theme=dark]{
  --bg:#161512; --surface:#1E1D19; --sunken:#272621;
  --border:#33312B; --border-strong:#45423A;
  --text:#EDEAE3; --muted:#A29D93; --faint:#7C776D;
  --accent:#7FB399; --accent-weak:#22302A; --danger:#D9836F;
  --m-notes:#7FB399; --m-rem:#D19A63; --m-task:#7FA3C4;
  --shadow-pop:0 4px 16px rgba(0,0,0,.35);
  --shadow-modal:0 16px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background .18s var(--ease),color .18s var(--ease);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition-duration:0s!important}}
.ico{width:18px;height:18px;stroke:currentColor;stroke-width:1.5;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ─────────────  SHELL  ───────────── */
.app{display:flex;min-height:100vh}

/* sidebar (desktop) */
.side{width:240px;flex:none;border-right:1px solid var(--border);
  padding:20px 12px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:0;height:100vh;background:var(--bg)}
.brand{font-family:var(--serif);font-size:24px;letter-spacing:-.01em;
  padding:4px 10px 18px;display:flex;align-items:center;gap:9px}
.brand-dot{width:9px;height:9px;border-radius:999px;background:var(--accent);flex:none}
.nav-i{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-md);
  color:var(--muted);font-size:14px;font-weight:450;
  transition:background .12s var(--ease),color .12s var(--ease);width:100%;text-align:left}
.nav-i:hover{background:var(--sunken);color:var(--text)}
.nav-i.on{background:var(--accent-weak);color:var(--accent);font-weight:500}
.nav-sep{height:1px;background:var(--border);margin:12px 10px}
.nav-lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);padding:0 10px 6px;margin-top:4px}
.side-foot{margin-top:auto}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.head{height:56px;flex:none;display:flex;align-items:center;gap:12px;
  padding:0 20px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg);z-index:20}
.head h1{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:-.01em}
.head-sp{flex:1}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-md);
  color:var(--muted);transition:background .12s var(--ease),color .12s var(--ease)}
.iconbtn:hover{background:var(--sunken);color:var(--text)}
.wrap{flex:1;overflow-y:auto}
.page{max-width:880px;margin:0 auto;padding:28px 32px 96px}

/* ─────────────  ATOM  ───────────── */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;
  border-radius:var(--r-md);font-size:14px;font-weight:500;
  transition:background .12s var(--ease),opacity .12s var(--ease)}
.btn-pri{background:var(--accent);color:#fff}
[data-theme=dark] .btn-pri{color:#131711}
.btn-pri:hover{opacity:.9}
.btn-sec{background:var(--sunken);color:var(--text)}
.btn-sec:hover{background:var(--border)}
.btn-gho{color:var(--muted)}
.btn-gho:hover{background:var(--sunken);color:var(--text)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:var(--r-sm);
  background:var(--sunken);color:var(--muted);font-size:12px;font-weight:500}
.chip-a{background:var(--accent-weak);color:var(--accent)}
.overline{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sec{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}
.sec h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.sec .lnk{margin-left:auto;font-size:13px;color:var(--faint);font-weight:450}
.sec .lnk:hover{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}

/* baris daftar */
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;width:100%;text-align:left;
  border-bottom:1px solid var(--border);transition:background .12s var(--ease);min-height:64px}
.row:last-child{border-bottom:none}
.row:hover{background:var(--sunken)}
.row-b{flex:1;min-width:0}
.row-t{font-size:15px;font-weight:450;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2px}
.row-m{font-size:12px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.row-m.late{color:var(--danger);font-weight:500}
.bar{width:3px;align-self:stretch;border-radius:999px;flex:none;margin:-13px 0;opacity:.8}

/* checkbox */
.cbx{width:20px;height:20px;border:1.5px solid var(--border-strong);border-radius:999px;
  flex:none;display:grid;place-items:center;transition:all .12s var(--ease)}
.cbx:hover{border-color:var(--accent)}
.cbx.on{background:var(--accent);border-color:var(--accent)}
.cbx svg{width:12px;height:12px;stroke:#fff;stroke-width:2.5;opacity:0;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
[data-theme=dark] .cbx.on svg{stroke:#131711}
.cbx.on svg{opacity:1}
.done .row-t{text-decoration:line-through;color:var(--faint)}

/* kosong */
.empty{text-align:center;padding:56px 20px}
.empty h3{font-size:15px;font-weight:600;margin-bottom:5px}
.empty p{font-size:14px;color:var(--muted);margin-bottom:18px}

/* ─────────────  BERANDA  ───────────── */
.hello{margin-bottom:32px}
.hello .d{font-family:var(--serif);font-size:30px;letter-spacing:-.01em;line-height:1.2}
.hello .s{font-size:14px;color:var(--muted);margin-top:5px}
.blk{margin-bottom:30px}

/* ─────────────  EDITOR  ───────────── */
.ed{max-width:34rem;margin:0 auto;padding:32px 24px 120px}
.ed-t{font-family:var(--serif);font-size:30px;line-height:1.25;width:100%;border:none;
  background:none;outline:none;letter-spacing:-.01em}
.ed-t::placeholder{color:var(--faint)}
.ed-tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 20px}
.ed-b{width:100%;border:none;background:none;outline:none;font-size:16px;line-height:1.65;
  resize:none;min-height:340px;color:var(--text)}
.ed-b::placeholder{color:var(--faint)}
.saved{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.saved .dot{width:5px;height:5px;border-radius:999px;background:var(--accent)}

/* ─────────────  TABS  ───────────── */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:0 0 11px;font-size:14px;font-weight:450;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s var(--ease)}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);font-weight:500;border-bottom-color:var(--accent)}
.daygrp{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.04em;
  padding:16px 2px 8px;text-transform:uppercase}
.daygrp:first-child{padding-top:0}

/* ─────────────  CARI  ───────────── */
.srch{display:flex;align-items:center;gap:10px;background:var(--sunken);
  border:1px solid transparent;border-radius:var(--r-md);padding:0 13px;height:42px;
  transition:border-color .12s var(--ease)}
.srch:focus-within{border-color:var(--accent)}
.srch input{flex:1;border:none;background:none;outline:none;font-size:15px}
.srch input::placeholder{color:var(--faint)}
mark{background:var(--accent-weak);color:var(--accent);border-radius:3px;padding:0 2px;font-weight:500}
.kbd{font-size:11px;font-family:var(--sans);color:var(--faint);background:var(--bg);
  border:1px solid var(--border);border-radius:4px;padding:2px 5px;font-weight:500}

/* ─────────────  FAB + SHEET  ───────────── */
.fab{position:fixed;right:24px;bottom:24px;width:52px;height:52px;border-radius:999px;
  background:var(--accent);color:#fff;display:grid;place-items:center;
  box-shadow:var(--shadow-pop);z-index:40;transition:transform .12s var(--ease)}
[data-theme=dark] .fab{color:#131711}
.fab:hover{transform:scale(1.04)}
.fab .ico{width:22px;height:22px;stroke-width:2}
.scrim{position:fixed;inset:0;background:rgba(28,27,24,.32);z-index:50;opacity:0;
  pointer-events:none;transition:opacity .18s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;right:24px;bottom:88px;width:270px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-modal);
  z-index:60;padding:6px;opacity:0;pointer-events:none;
  transform:translateY(8px);transition:opacity .18s var(--ease),transform .18s var(--ease)}
.sheet.on{opacity:1;pointer-events:auto;transform:none}
.sheet-i{display:flex;align-items:center;gap:12px;padding:10px 11px;border-radius:var(--r-md);
  width:100%;text-align:left;font-size:14px;transition:background .12s var(--ease)}
.sheet-i:hover{background:var(--sunken)}
.sheet-i span{color:var(--faint);font-size:12px;margin-left:auto}

/* ─────────────  TOAST  ───────────── */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);z-index:70;
  background:var(--text);color:var(--bg);border-radius:var(--r-md);padding:10px 12px 10px 16px;
  display:flex;align-items:center;gap:16px;font-size:14px;box-shadow:var(--shadow-modal);
  opacity:0;pointer-events:none;transition:opacity .18s var(--ease),transform .18s var(--ease)}
.toast.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.toast button{font-weight:600;font-size:13px;color:var(--bg);opacity:.85}
.toast button:hover{opacity:1}

/* ─────────────  BOTTOM NAV (mobile)  ───────────── */
.bnav{display:none}

@media (max-width:768px){
  .side{display:none}
  .page{padding:20px 20px 96px}
  .ed{padding:24px 20px 120px}
  .head{padding:0 16px}
  .head h1{font-size:20px}
  .hello .d{font-size:26px}
  .ed-t{font-size:26px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);background:var(--bg);
    border-top:1px solid var(--border);z-index:30}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;color:var(--faint);font-size:11px;font-weight:500;transition:color .12s var(--ease)}
  .bnav button.on{color:var(--accent)}
  .bnav .ico{width:20px;height:20px}
  .fab{bottom:calc(72px + env(safe-area-inset-bottom));right:16px;width:48px;height:48px}
  .sheet{left:16px;right:16px;width:auto;bottom:calc(132px + env(safe-area-inset-bottom))}
  .toast{left:16px;right:16px;transform:translateY(8px)}
  .toast.on{transform:none}
}
/* keterangan prototipe */
.note{max-width:880px;margin:0 auto;padding:0 32px 40px;font-size:13px;color:var(--faint);line-height:1.6}
@media(max-width:768px){.note{padding:0 20px 40px}}
</style>
</head>

<script>
const notes=[
 {t:'Struktur modul Hara',s:'Tiap modul mengekspor satu objek: id, nama, ikon, rute…',m:'2j',pin:1,tags:['hara','arsitektur']},
 {t:'Belanja mingguan',s:'Beras 5kg, kopi, telur, minyak goreng, sabun cuci',m:'5j',pin:1,tags:['rumah']},
 {t:'Ide nama untuk fitur jurnal',s:'Harian · Runut · Jejak — yang terakhir paling enak diucapkan',m:'Kemarin',tags:['ide']},
 {t:'Catatan rapat 4 September',s:'Deadline mundur seminggu. Perlu konfirmasi ke tim desain hari Senin.',m:'2 hari',tags:['kerja']},
 {t:'Resep nasi goreng kampung',s:'Kunci: nasi dingin semalam, api besar, kecap manis di akhir',m:'5 hari',tags:['masak']},
 {t:'Buku yang mau dibaca',s:'The Design of Everyday Things · Refactoring UI · Atomic Habits',m:'1 mgg',tags:['baca']},
];
const rem=[
 {g:'Terlewat',i:[{t:'Bayar tagihan listrik',m:'Kemarin 09.00',late:1}]},
 {g:'Hari Ini',i:[{t:'Telepon dokter gigi',m:'14.00'},{t:'Kirim draft ke Rani',m:'17.30'},{t:'Minum obat',m:'20.00'}]},
 {g:'Besok',i:[{t:'Servis motor',m:'08.00'},{t:'Rapat mingguan tim',m:'10.00'}]},
 {g:'Sabtu, 13 September',i:[{t:'Ulang tahun Ibu',m:'Sepanjang hari'}]},
];
const tasks=[
 {t:'Rancang skema database Hara',m:'Hari ini',done:0},
 {t:'Bikin komponen ListRow',m:'Besok',done:0},
 {t:'Riset library markdown ringan',m:'—',done:0},
 {t:'Pilih palet warna',m:'',done:1},
 {t:'Baca dokumentasi Dexie',m:'',done:1},
];

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cbx=on=>`<button class="cbx ${on?'on':''}" onclick="tick(this)"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></button>`;

function noteRow(n,color){return `<button class="row" onclick="go('editor')">
  ${color?`<span class="bar" style="background:var(--m-notes)"></span>`:''}
  <div class="row-b"><div class="row-t">${esc(n.t)}</div><div class="row-s">${esc(n.s)}</div></div>
  <span class="row-m">${n.m}</span></button>`}

const titles={home:'Beranda',notes:'Catatan',editor:'',rem:'Reminder',task:'Tugas',
  search:'Cari',tags:'Tag',arsip:'Arsip',set:'Pengaturan'};
let cur='home';
function go(v){
  cur=v;
  document.getElementById('wrap').innerHTML=views[v]();
  document.getElementById('wrap').scrollTop=0;
  document.getElementById('title').textContent=titles[v];
  document.getElementById('back').style.display=v==='editor'?'grid':'none';
  document.getElementById('saved').style.display=v==='editor'?'flex':'none';
  document.querySelectorAll('.nav-i,.bnav button').forEach(b=>
    b.classList.toggle('on',b.dataset.go===v));
  closeSheet();
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return;}
  const n=e.target.closest('[data-new]');
  if(n){closeSheet();toast(n.dataset.new==='notes'?'Catatan baru dibuat':'Item baru dibuat');
    if(n.dataset.new==='notes')go('editor');}
});
document.getElementById('back').onclick=()=>go('notes');
function tick(el){el.classList.toggle('on');
  const r=el.closest('.row'); r.classList.toggle('done',el.classList.contains('on'));
  if(el.classList.contains('on'))toast('Ditandai selesai');}
let tt;
function toast(m){document.getElementById('toast-t').textContent=m;
  document.getElementById('toast').classList.add('on');
  clearTimeout(tt);tt=setTimeout(hideToast,3000);}
function hideToast(){document.getElementById('toast').classList.remove('on')}
const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim');
function closeSheet(){sheet.classList.remove('on');scrim.classList.remove('on')}
document.getElementById('fab').onclick=()=>{sheet.classList.toggle('on');scrim.classList.toggle('on')};
scrim.onclick=closeSheet;
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function toggleTheme(){
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  document.querySelector('#theme use').setAttribute('href',d?'#i-moon':'#i-sun');}
document.getElementById('theme').onclick=toggleTheme;
document.addEventListener('click',e=>{if(e.target.id==='theme2')toggleTheme()});
go('home');
</script>
