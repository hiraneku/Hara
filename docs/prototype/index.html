<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hara — Prototipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Instrument+Serif&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF8; --surface:#FFFFFF; --sunken:#F3F1ED;
  --border:#E6E2DB; --border-strong:#D4CFC5;
  --text:#1C1B18; --muted:#6B675F; --faint:#9A958B;
  --accent:#3F6F5B; --accent-weak:#E8F0EB; --danger:#A34434;
  --link:#2F6E8F; --link-dead:#B0715E;
  --m-notes:#3F6F5B; --m-rem:#B5723A; --m-task:#4A6B8A;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --shadow-pop:0 4px 16px rgba(28,27,24,.08);
  --shadow-modal:0 16px 48px rgba(28,27,24,.16);
  --ease:cubic-bezier(.2,.6,.2,1);
  --sans:'Inter',system-ui,sans-serif; --serif:'Instrument Serif',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme=dark]{
  --bg:#161512; --surface:#1E1D19; --sunken:#272621;
  --border:#33312B; --border-strong:#45423A;
  --text:#EDEAE3; --muted:#A29D93; --faint:#7C776D;
  --accent:#7FB399; --accent-weak:#22302A; --danger:#D9836F;
  --link:#7FB0CC; --link-dead:#C98F79;
  --m-notes:#7FB399; --m-rem:#D19A63; --m-task:#7FA3C4;
  --shadow-pop:0 4px 16px rgba(0,0,0,.35); --shadow-modal:0 16px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important;animation-duration:0s!important}}
.ico{width:18px;height:18px;stroke:currentColor;stroke-width:1.5;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:flex;min-height:100vh}
.side{width:240px;flex:none;border-right:1px solid var(--border);padding:20px 12px;
  display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;background:var(--bg)}
.brand{font-family:var(--serif);font-size:24px;padding:4px 10px 18px;display:flex;align-items:center;gap:9px}
.brand-dot{width:9px;height:9px;border-radius:999px;background:var(--accent)}
.nav-i{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-md);
  color:var(--muted);font-size:14px;transition:.12s var(--ease);width:100%}
.nav-i:hover{background:var(--sunken);color:var(--text)}
.nav-i.on{background:var(--accent-weak);color:var(--accent);font-weight:500}
.nav-i .ct{margin-left:auto;font-size:12px;color:var(--faint)}
.nav-sep{height:1px;background:var(--border);margin:12px 10px}
.side-foot{margin-top:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.head{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:20}
.head h1{font-family:var(--serif);font-size:22px;font-weight:400}
.sp{flex:1}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-md);
  color:var(--muted);transition:.12s var(--ease)}
.iconbtn:hover{background:var(--sunken);color:var(--text)}
.wrap{flex:1;overflow-y:auto}
.page{max-width:880px;margin:0 auto;padding:28px 32px 120px}

.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;
  border-radius:var(--r-md);font-size:14px;font-weight:500;transition:.12s var(--ease)}
.btn-pri{background:var(--accent);color:#fff}
[data-theme=dark] .btn-pri{color:#131711}
.btn-pri:hover{opacity:.9}
.btn-sec{background:var(--sunken)}
.btn-sec:hover{background:var(--border)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:var(--r-sm);
  background:var(--sunken);color:var(--muted);font-size:12px;font-weight:500}
.chip-a{background:var(--accent-weak);color:var(--accent)}
.overline{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;width:100%;
  border-bottom:1px solid var(--border);transition:.12s var(--ease);min-height:64px}
.row:last-child{border-bottom:none}
.row:hover{background:var(--sunken)}
.row-b{flex:1;min-width:0}
.row-t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row-m{font-size:12px;color:var(--faint);flex:none}
.empty{text-align:center;padding:64px 20px}
.empty h3{font-size:15px;font-weight:600;margin-bottom:6px}
.empty p{font-size:14px;color:var(--muted);margin-bottom:20px;max-width:340px;margin-inline:auto;line-height:1.6}
.sec{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}
.sec h2{font-size:13px;font-weight:600;color:var(--muted)}
.hello{margin-bottom:32px}
.hello .d{font-family:var(--serif);font-size:30px;line-height:1.2}
.hello .s{font-size:14px;color:var(--muted);margin-top:5px}

/* ── EDITOR ── */
.ed{max-width:34rem;margin:0 auto;padding:28px 24px 160px}
.ed-t{font-family:var(--serif);font-size:30px;line-height:1.25;width:100%;border:none;
  background:none;outline:none}
/* properties */
.props{margin:16px 0 6px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 0}
.prop{display:flex;align-items:center;gap:12px;padding:6px 2px;font-size:13px}
.prop-k{width:104px;flex:none;color:var(--faint);display:flex;align-items:center;gap:7px}
.prop-k .ico{width:14px;height:14px}
.prop-v{color:var(--text)}
.prop-add{font-size:12px;color:var(--faint);padding:6px 2px}
.prop-add:hover{color:var(--accent)}
/* blok */
.blocks{margin-top:18px}
.blk{position:relative;padding:3px 0}
.blk-h{position:absolute;left:-30px;top:5px;width:22px;height:22px;display:grid;place-items:center;
  border-radius:5px;color:var(--faint);opacity:0;transition:.12s var(--ease);cursor:grab}
.blk:hover .blk-h{opacity:1}
.blk-h:hover{background:var(--sunken);color:var(--text)}
.blk-h .ico{width:14px;height:14px}
.b-h1{font-family:var(--serif);font-size:25px;line-height:1.3;margin:18px 0 4px}
.b-h2{font-family:var(--serif);font-size:20px;line-height:1.3;margin:16px 0 2px}
.b-p{font-size:16px;line-height:1.65}
.ed-doc{outline:none;min-height:50vh}
.ed-doc>*{position:relative;padding:3px 0}
.ed-doc>*:first-child:last-child:empty::before,
.ed-doc>[data-ph]:only-child:empty::before{content:attr(data-ph);color:var(--faint)}
.ed-doc .b-code{margin:6px 0}
.ed-doc .b-todo{align-items:flex-start}
.mech-top{display:flex;align-items:center;gap:10px;padding:6px 12px 2px}
.counter{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11.5px;
  color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.counter b{color:var(--text);font-weight:600}
.counter .dot{color:var(--faint)}

.b-quote{border-left:2.5px solid var(--border-strong);padding-left:14px;color:var(--muted);
  font-size:16px;line-height:1.65}
.b-code{background:var(--sunken);border-radius:var(--r-sm);padding:12px 14px;font-family:var(--mono);
  font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-x:auto}
.b-todo{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.65}
.b-li{display:flex;gap:10px;font-size:16px;line-height:1.65}
.b-li::before{content:'•';color:var(--faint);flex:none}
.b-cal{background:var(--accent-weak);border-left:2.5px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:12px 14px;font-size:15px;line-height:1.6}
.b-cal .t{font-weight:600;color:var(--accent);font-size:13px;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.b-div{height:1px;background:var(--border);margin:18px 0}
.cbx{width:19px;height:19px;border:1.5px solid var(--border-strong);border-radius:999px;flex:none;
  display:grid;place-items:center;margin-top:3px;transition:.12s var(--ease)}
.cbx:hover{border-color:var(--accent)}
.cbx.on{background:var(--accent);border-color:var(--accent)}
.cbx svg{width:11px;height:11px;stroke:#fff;stroke-width:2.5;fill:none;opacity:0;
  stroke-linecap:round;stroke-linejoin:round}
[data-theme=dark] .cbx.on svg{stroke:#131711}
.cbx.on svg{opacity:1}
.b-todo.done span{text-decoration:line-through;color:var(--faint)}
/* inline */
.wl{color:var(--link);cursor:pointer;border-bottom:1px solid transparent}
.wl:hover{border-bottom-color:var(--link)}
.wl.dead{color:var(--link-dead);border-bottom:1px dashed var(--link-dead)}
.tg{color:var(--accent);cursor:pointer;font-weight:500}
.hl{background:#F3E7B8;border-radius:3px;padding:0 3px}
[data-theme=dark] .hl{background:#4A4222;color:#F0E5C0}
code.ic{background:var(--sunken);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:.87em}
/* blok tersemat */
.emb{border:1px solid var(--border);border-radius:var(--r-md);padding:13px 15px;background:var(--surface)}
.emb-h{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px;margin-bottom:7px;
  letter-spacing:.06em;text-transform:uppercase}
.emb-h .ico{width:12px;height:12px}

/* backlink & graph */
.panel{max-width:34rem;margin:36px auto 0;border-top:1px solid var(--border);padding-top:22px}
.panel-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
.panel-h .n{background:var(--sunken);color:var(--faint);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
.bl{border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;
  background:var(--surface);transition:.12s var(--ease);display:block;width:100%}
.bl:hover{border-color:var(--border-strong)}
.bl-t{font-size:14px;font-weight:500;margin-bottom:4px}
.bl-c{font-size:13px;color:var(--muted);line-height:1.55}
.bl-c b{background:var(--accent-weak);color:var(--accent);font-weight:500;border-radius:3px;padding:0 3px}
.unl{display:flex;align-items:center;gap:10px;border:1px dashed var(--border-strong);border-radius:var(--r-md);
  padding:11px 14px;font-size:13px;color:var(--muted)}
.unl .btn{height:28px;font-size:12.5px;margin-left:auto;flex:none}

/* ── BAR MEKANIK (di atas keyboard) ── */
.mech{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);
  border-top:1px solid var(--border);display:none;padding-bottom:env(safe-area-inset-bottom)}
.mech.on{display:block}
.mech-in{display:flex;gap:2px;overflow-x:auto;padding:7px 8px;scrollbar-width:none;
  touch-action:pan-x;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.mech-in::-webkit-scrollbar{display:none}
.mb{touch-action:manipulation;flex:none;min-width:40px;height:38px;padding:0 11px;border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--muted);font-size:14px;font-weight:600;
  transition:.12s var(--ease);font-family:var(--mono);white-space:nowrap}
.mb:hover,.mb:active{background:var(--sunken);color:var(--text)}
.mb.acc{color:var(--accent)}
.mb-sep{width:1px;background:var(--border);margin:6px 5px;flex:none}
.mech-lbl{font-size:10.5px;color:var(--faint);padding:0 10px 6px;letter-spacing:.04em}

/* popup: slash & wikilink & palette */
.pop{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-modal);z-index:80;overflow:hidden;display:none;width:290px}
.pop.on{display:block}
.pop-h{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
  padding:10px 13px 6px;font-weight:600}
.pop-i{display:flex;align-items:center;gap:11px;padding:9px 13px;font-size:14px;transition:.1s var(--ease);width:100%}
.pop-i:hover,.pop-i.sel{background:var(--sunken)}
.pop-i .k{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.pop-i .sub{font-size:12px;color:var(--faint)}
.pop-i .ico{color:var(--faint)}
.pop-new{color:var(--accent)}

/* graph */
.graph{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);height:190px;position:relative;overflow:hidden}
.gnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:5px;cursor:pointer}
.gdot{width:11px;height:11px;border-radius:999px;background:var(--border-strong)}
.gnode.me .gdot{width:15px;height:15px;background:var(--accent)}
.gnode span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.gnode.me span{color:var(--text);font-weight:500}

.fab{position:fixed;right:24px;bottom:24px;width:52px;height:52px;border-radius:999px;
  background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-pop);z-index:40}
[data-theme=dark] .fab{color:#131711}
.fab .ico{width:22px;height:22px;stroke-width:2}
.scrim{position:fixed;inset:0;background:rgba(28,27,24,.32);z-index:50;opacity:0;pointer-events:none;transition:.18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;right:24px;bottom:88px;width:270px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow-modal);z-index:60;padding:6px;display:none}
.sheet.on{display:block}
.sheet-i{display:flex;align-items:center;gap:12px;padding:10px 11px;border-radius:var(--r-md);width:100%;font-size:14px}
.sheet-i:hover{background:var(--sunken)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--text);
  color:var(--bg);border-radius:var(--r-md);padding:10px 16px;font-size:14px;box-shadow:var(--shadow-modal);
  opacity:0;pointer-events:none;transition:.18s}
.toast.on{opacity:1}
.bnav{display:none}
.note{max-width:880px;margin:0 auto;padding:26px 32px 40px;font-size:13px;color:var(--faint);line-height:1.65}

@media(max-width:768px){
  .side{display:none}
  .page{padding:20px 20px 110px}
  .ed{padding:22px 20px 200px}
  .head{padding:0 14px} .head h1{font-size:19px}
  .hello .d{font-size:26px} .ed-t{font-size:26px}
  .blk-h{display:none}
  .note{padding:20px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--border);z-index:30}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;color:var(--faint);font-size:11px;font-weight:500}
  .bnav button.on{color:var(--accent)}
  .bnav .ico{width:20px;height:20px}
  .bnav.hide{display:none}
  .fab{bottom:calc(70px + env(safe-area-inset-bottom));right:16px;width:48px;height:48px}
  .fab.hide{display:none}
  .sheet{left:16px;right:16px;width:auto;bottom:calc(128px + env(safe-area-inset-bottom))}
  .pop{left:12px!important;right:12px;width:auto!important}
}
</style>
</head>

const notes=[{id:'w',t:'Selamat datang di Hara',welcome:true,mod:'baru saja',

let openId='w';
const findNote=id=>notes.find(n=>n.id===id);
function newNote(){
  const n={id:'n'+(seq++),t:'',welcome:false,mod:'baru saja',ex:''};
  notes.unshift(n);openId=n.id;go('editor');
  setTimeout(()=>{const i=document.querySelector('.ed-t');if(i)i.focus();},60);

}
function delNote(){
  const i=notes.findIndex(n=>n.id===openId);
  if(i>-1)notes.splice(i,1);
  toast('Catatan dihapus');go('notes');
}
/* judul & isi tersimpan saat diketik */

 return `<div class="ed">

 </div>

<p class="note">Target: hasil muncul di bawah 50 ms untuk 10.000 catatan — indeks tersimpan, tanpa pemindaian ulang saat aplikasi dibuka.</p>`,

  <svg class="ico" style="color:var(--faint)"><use href="#i-tag"/></svg>

  <p>Catatan yang diarsipkan hilang dari daftar utama tapi tetap bisa dicari.</p></div></div>`,

set:()=>`<div class="page">
  <div class="sec"><h2>Tampilan</h2></div>
  <div class="card" style="margin-bottom:24px">
    <div class="row"><div class="row-b"><div class="row-t">Tema</div><div class="row-s">Mengikuti sistem</div></div>

    <div class="row"><div class="row-b"><div class="row-t">Bar mekanik</div>
      <div class="row-s">Tampil saat mengedit · isinya bisa diatur</div></div></div>
  </div>

    <div class="row"><div class="row-b"><div class="row-t">Impor vault Obsidian</div>

    <div class="row"><div class="row-b"><div class="row-t">Ekspor semua</div>
      <div class="row-s">Markdown · JSON · PDF</div></div>

  <p class="note" style="padding:24px 0 0">Hara v0.1 · prototipe desain · data tersimpan di perangkat</p></div>`};

const titles={home:'Beranda',notes:'Catatan',editor:'',rem:'Reminder',task:'Tugas',
  search:'Cari',tags:'Tag',arsip:'Arsip',set:'Pengaturan'};
let cur='home';
function go(v){
  cur=v;const w=document.getElementById('wrap');
  w.innerHTML=views[v]();w.scrollTop=0;
  document.getElementById('title').textContent=titles[v];
  const isEd=v==='editor';
  document.getElementById('back').style.display=isEd?'grid':'none';
  document.getElementById('del').style.display=isEd?'grid':'none';
  document.getElementById('dots').style.display=isEd?'none':'grid';
  document.getElementById('mech').classList.toggle('on',isEd);
  document.getElementById('bnav').classList.toggle('hide',isEd);
  document.getElementById('fab').classList.toggle('hide',isEd);
  document.querySelectorAll('.nav-i,.bnav button').forEach(b=>b.classList.toggle('on',b.dataset.go===v));
  closeAll();savedRange=null;updateCount();
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
  const o=e.target.closest('[data-open]');if(o){openId=o.dataset.open;go('editor');return;}
  if(e.target.closest('[data-act2="new"]')){newNote();return;}
  const n=e.target.closest('[data-new]');
  if(n){closeAll();if(n.dataset.new==='note')newNote();else toast('Dibuat');}
});
document.getElementById('back').onclick=()=>go('notes');
function tick(el){el.classList.toggle('on');
  el.parentElement.classList.toggle('done',el.classList.contains('on'));}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(a)toast(a.dataset.act);});
let tt;function toast(m){const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200);}

/* ════════ MESIN EDITOR ════════ */
const pop=document.getElementById('pop');
let savedRange=null;

const docEl=()=>document.querySelector('.ed-doc');
function curBlock(){
  const d=docEl();if(!d)return null;
  const fb=()=>d.lastElementChild||d.firstElementChild;
  const sel=getSelection();
  let r=null;
  if(sel.rangeCount&&d.contains(sel.getRangeAt(0).startContainer))r=sel.getRangeAt(0);
  else if(savedRange&&d.contains(savedRange.startContainer))r=savedRange;
  if(!r)return fb();
  let n=r.startContainer;
  if(n.nodeType===3)n=n.parentNode;
  while(n&&n.parentNode!==d)n=n.parentNode;
  return n||fb();
}
function saveSel(){const s=getSelection();
  if(s.rangeCount&&docEl()&&docEl().contains(s.getRangeAt(0).startContainer))savedRange=s.getRangeAt(0).cloneRange();}
function restoreSel(){
  const d=docEl();if(!d)return null;
  d.focus();
  const s=getSelection();
  if(savedRange&&d.contains(savedRange.startContainer)){
    s.removeAllRanges();s.addRange(savedRange);return savedRange;}
  if(s.rangeCount&&d.contains(s.getRangeAt(0).startContainer))return s.getRangeAt(0);
  const b=d.lastElementChild||d.firstElementChild;
  if(!b)return null;
  const r=document.createRange();r.selectNodeContents(b);r.collapse(false);
  s.removeAllRanges();s.addRange(r);savedRange=r.cloneRange();return r;
}
function caretAfter(node){
  const r=document.createRange();r.setStartAfter(node);r.collapse(true);
  const s=getSelection();s.removeAllRanges();s.addRange(r);saveSel();
}

/* ── bungkus seleksi dengan elemen inline ── */
function wrapSel(tag,cls){
  const r=restoreSel();if(!r)return;
  const el=document.createElement(tag);if(cls)el.className=cls;
  if(r.collapsed){el.textContent='teks';r.insertNode(el);
    const nr=document.createRange();nr.selectNodeContents(el);
    getSelection().removeAllRanges();getSelection().addRange(nr);}
  else{el.appendChild(r.extractContents());r.insertNode(el);caretAfter(el);}
  saveSel();updateCount();
}
/* ── ubah jenis blok ── */
const BLOCKCLS=['b-p','b-h1','b-h2','b-quote','b-code','b-li','b-todo'];
function setBlock(cls){
  restoreSel();const b=curBlock();if(!b)return;
  const wasTodo=b.classList.contains('b-todo');
  const cb=b.querySelector('.cbx');if(cb)cb.remove();
  BLOCKCLS.forEach(c=>b.classList.remove(c));
  b.classList.add(cls);
  if(cls==='b-todo'){
    const box=document.createElement('button');box.className='cbx';box.contentEditable='false';
    box.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>';
    b.insertBefore(box,b.firstChild);
  }
  placeCaretEnd(b);updateCount();
}
function placeCaretEnd(b){
  const r=document.createRange();r.selectNodeContents(b);r.collapse(false);
  const s=getSelection();s.removeAllRanges();s.addRange(r);saveSel();
}
function insertText(t){
  const r=restoreSel();if(!r)return;
  r.deleteContents();
  const n=document.createTextNode(t);r.insertNode(n);caretAfter(n);updateCount();
}
function insertEl(html){
  const r=restoreSel();if(!r)return;
  const tmp=document.createElement('div');tmp.innerHTML=html;
  const el=tmp.firstElementChild;
  r.deleteContents();r.insertNode(el);
  const sp=document.createTextNode('\u00a0');el.after(sp);caretAfter(sp);updateCount();
}

/* ════════ MARKDOWN OTOMATIS SAAT MENGETIK ════════ */
/* pola inline: dipicu tepat ketika penutupnya selesai diketik */
const INLINE=[
  {re:/\*\*([^*\n]+)\*\*$/,tag:'b'},
  {re:/(?:^|[^*])\*([^*\n]+)\*$/,tag:'i',g:1},
  {re:/__([^_\n]+)__$/,tag:'b'},
  {re:/~~([^~\n]+)~~$/,tag:'s'},
  {re:/==([^=\n]+)==$/,tag:'span',cls:'hl'},
  {re:/`([^`\n]+)`$/,tag:'code',cls:'ic'},
  {re:/\[\[([^\]\n]+)\]\]$/,tag:'span',cls:'wl'},
];
/* pola awal baris → ubah jenis blok */
const LINE=[
  [/^#\s/,'b-h1'],[/^##\s/,'b-h2'],[/^###\s/,'b-h2'],
  [/^>\s/,'b-quote'],[/^```$/,'b-code'],
  [/^[-*]\s\[\s?\]\s/,'b-todo'],[/^[-*+]\s/,'b-li'],
];

const INLINE_SEL='b,i,s,strong,em,code.ic,.hl,.wl,.tg';
/* buang bungkus inline yang sudah kosong / hanya berisi zero-width */
function cleanEmpty(){
  const d=docEl();if(!d)return;
  const sel=getSelection();
  const caretIn=sel.rangeCount?sel.getRangeAt(0).startContainer:null;
  d.querySelectorAll(INLINE_SEL).forEach(el=>{
    const t=el.textContent.replace(/\u200b/g,'');
    if(t!=='')return;
    if(caretIn&&el.contains(caretIn)){
      const sp=document.createTextNode('\u200b');
      el.after(sp);
      const r=document.createRange();r.setStart(sp,1);r.collapse(true);
      sel.removeAllRanges();sel.addRange(r);saveSel();
    }
    el.remove();
  });
  /* blok kosong: pastikan tetap punya <br> agar bisa diketik lagi */
  Array.from(d.children).forEach(b=>{
    if(!b.textContent.replace(/\u200b/g,'')&&!b.querySelector('br,img,.cbx'))
      b.appendChild(document.createElement('br'));
  });
}
/* Backspace tepat di batas elemen inline -> keluar dari format, bukan mengetik di dalamnya */
function escapeFormatIfNeeded(){
  const sel=getSelection();if(!sel.rangeCount)return;
  const r=sel.getRangeAt(0);if(!r.collapsed)return;
  let n=r.startContainer;
  if(n.nodeType===3&&r.startOffset===n.data.length){
    const host=n.parentElement&&n.parentElement.closest(INLINE_SEL);
    if(host&&n===host.lastChild){/* biarkan; zero-width sudah menangani */}
  }
}
function autoFormat(){
  const sel=getSelection();if(!sel.rangeCount)return;
  const r=sel.getRangeAt(0);if(!r.collapsed)return;
  const node=r.startContainer;if(node.nodeType!==3)return;
  const off=r.startOffset;
  const b=curBlock();if(!b)return;

  /* 1. awal baris */
  const txt=b.textContent;
  // to-do diperiksa lebih dulu; juga menangani kasus blok sudah terlanjur jadi daftar
  const todoRe=b.classList.contains('b-li')?/^\[\s?\]\s/:/^[-*]\s\[\s?\]\s/;
  const mt=txt.match(todoRe);
  if(mt&&!b.classList.contains('b-todo')){
    node.deleteData(0,Math.min(mt[0].length,node.data.length));
    b.classList.remove('b-li');setBlock('b-todo');return;
  }
  for(const [re,cls] of LINE){
    if(cls==='b-todo')continue;
    const m=txt.match(re);
    if(m&&!b.classList.contains(cls)){
      node.deleteData(0,Math.min(m[0].length,node.data.length));
      setBlock(cls);return;
    }
  }
  /* 2. inline */
  const before=node.data.slice(0,off);
  for(const p of INLINE){
    const m=before.match(p.re);
    if(!m)continue;
    const inner=m[p.g||1];
    const full=m[0].startsWith('*')||!p.g?m[0]:m[0].slice(1);
    const start=off-full.length;
    if(start<0)continue;
    const el=document.createElement(p.tag);
    if(p.cls)el.className=p.cls;
    el.textContent=inner;
    if(p.cls==='wl')el.textContent='[['+inner+']]';
    const rr=document.createRange();
    rr.setStart(node,start);rr.setEnd(node,off);
    rr.deleteContents();rr.insertNode(el);
    const sp=document.createTextNode('\u200b');
    el.after(sp);
    const nr=document.createRange();nr.setStart(sp,1);nr.collapse(true);
    sel.removeAllRanges();sel.addRange(nr);saveSel();
    return;
  }
}

/* ════════ PENGHITUNG HURUF ════════ */
function updateCount(){
  const el=document.getElementById('count');if(!el)return;
  const d=docEl();const t=document.querySelector('.ed-t');
  if(!d){el.style.display='none';return;}
  el.style.display='flex';
  const body=(d.innerText!==undefined?d.innerText:d.textContent||'').replace(/\u200b/g,'');
  const chars=body.length+((t&&t.value)?t.value.length:0);
  const words=body.trim()?body.trim().split(/\s+/).length:0;
  el.innerHTML=`<b>${chars.toLocaleString('id')}</b> huruf<span class="dot">·</span>${words.toLocaleString('id')} kata`;
  const n=findNote(openId);
  if(n){n.ex=body.trim().slice(0,80);}
}

/* ════════ BAR MEKANIK ════════ */
const menus={
slash:`<div class="pop-h">Sisipkan blok</div>`+[
  ['i-txt','Teks','','b-p'],['i-hash','Heading 1','#','b-h1'],['i-hash','Heading 2','##','b-h2'],
  ['i-check2','To-do','- [ ]','b-todo'],['i-quote','Kutipan','>','b-quote'],['i-code','Kode','```','b-code'],
  ['i-txt','Daftar','-','b-li']]
  .map(([i,n,k,c])=>`<button class="pop-i" data-blk="${c}"><svg class="ico"><use href="#${i}"/></svg>${n}<span class="k">${k}</span></button>`).join(''),
wl:`<div class="pop-h">Tautkan ke catatan</div>`,
tag:`<div class="pop-h">Tag</div>
  <button class="pop-i" data-ins="#hara"><svg class="ico"><use href="#i-tag"/></svg>hara<span class="k">1</span></button>
  <button class="pop-i" data-ins="#proyek/hara"><svg class="ico"><use href="#i-tag"/></svg>proyek/hara<span class="k">0</span></button>`};

function wlMenu(){
  let h=`<div class="pop-h">Tautkan ke catatan</div>`;
  notes.forEach(n=>{h+=`<button class="pop-i" data-wl="${(n.t||'Tanpa judul').replace(/"/g,'&quot;')}">
    <svg class="ico"><use href="#i-note"/></svg>${n.t||'Tanpa judul'}</button>`;});
  h+=`<button class="pop-i pop-new" data-wl="Catatan Baru"><svg class="ico"><use href="#i-plus"/></svg>Buat catatan baru…</button>`;
  return h;
}

/* mousedown: cegah editor kehilangan fokus */
document.querySelectorAll('.mb').forEach(b=>{
  b.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')e.preventDefault();});
  b.onclick=()=>{
    const m=b.dataset.m;
    if(m==='slash'){openPop(menus.slash,b);return;}
    if(m==='wl'){openPop(wlMenu(),b);return;}
    if(m==='tag'){openPop(menus.tag,b);return;}
    const act={
      h:()=>setBlock('b-h1'),h2:()=>setBlock('b-h2'),quote:()=>setBlock('b-quote'),
      code:()=>setBlock('b-code'),todo:()=>setBlock('b-todo'),li:()=>setBlock('b-li'),
      b:()=>wrapSel('b'),i:()=>wrapSel('i'),hl:()=>wrapSel('span','hl'),
      in:()=>{const bl=curBlock();if(bl){bl.style.paddingLeft=(parseInt(bl.style.paddingLeft||0)+24)+'px';restoreSel();}},
      out:()=>{const bl=curBlock();if(bl){bl.style.paddingLeft=Math.max(0,parseInt(bl.style.paddingLeft||0)-24)+'px';restoreSel();}},
    }[m];
    if(act)act();
  };
});
pop.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')e.preventDefault();});
pop.addEventListener('click',e=>{
  const t=e.target.closest('[data-blk],[data-ins],[data-wl]');if(!t)return;
  if(t.dataset.blk)setBlock(t.dataset.blk);
  else if(t.dataset.ins)insertEl(`<span class="tg">${t.dataset.ins}</span>`);
  else if(t.dataset.wl)insertEl(`<span class="wl">[[${t.dataset.wl}]]</span>`);
  closeAll();
});
function openPop(html,anchor){
  pop.innerHTML=html;pop.classList.add('on');
  const r=anchor.getBoundingClientRect();
  pop.style.left=Math.max(12,Math.min(r.left,innerWidth-302))+'px';
  pop.style.top=Math.max(12,r.top-pop.offsetHeight-10)+'px';
}

/* ── event editor ── */
const inDoc=t=>t&&t.closest&&t.closest('.ed-doc');
document.addEventListener('input',e=>{
  if(inDoc(e.target)){autoFormat();cleanEmpty();updateCount();}
  else if(e.target.classList&&e.target.classList.contains('ed-t'))updateCount();
});
document.addEventListener('keyup',e=>{if(inDoc(e.target))saveSel();});
document.addEventListener('selectionchange',()=>{
  const s=getSelection();
  if(s.rangeCount&&inDoc(s.getRangeAt(0).startContainer.parentElement||s.getRangeAt(0).startContainer))saveSel();
});
document.addEventListener('mouseup',e=>{
  if(e.target.closest&&e.target.closest('.ed-doc'))saveSel();
});
document.addEventListener('keydown',e=>{
  if(!inDoc(e.target))return;
  if(e.key==='Enter'&&!e.shiftKey){
    const b=curBlock();
    if(b&&(b.classList.contains('b-h1')||b.classList.contains('b-h2')||b.classList.contains('b-code'))){
      e.preventDefault();
      const nb=document.createElement('div');nb.className='b-p';nb.innerHTML='<br>';
      b.after(nb);placeCaretEnd(nb);updateCount();
    }
  }
  if(e.key==='Backspace'){
    const sel=getSelection();
    if(sel.rangeCount&&sel.getRangeAt(0).collapsed){
      const b=curBlock();
      const atStart=(()=>{const r=sel.getRangeAt(0);
        const rr=document.createRange();rr.selectNodeContents(b);rr.setEnd(r.startContainer,r.startOffset);
        return rr.toString().replace(/\u200b/g,'').length===0;})();
      const fancy=b&&!b.classList.contains('b-p');
      if(atStart&&fancy){
        e.preventDefault();
        const cb=b.querySelector('.cbx');if(cb)cb.remove();
        b.classList.remove('b-h1','b-h2','b-quote','b-code','b-li','b-todo','done');
        b.classList.add('b-p');b.style.paddingLeft='';
        placeCaretEnd(b);updateCount();return;
      }
    }
  }
  if(e.key==='Tab'){e.preventDefault();
    const b=curBlock();if(b){const cur=parseInt(b.style.paddingLeft||0);
    b.style.paddingLeft=Math.max(0,cur+(e.shiftKey?-24:24))+'px';}}
});
/* checkbox di dalam editor */
document.addEventListener('click',e=>{
  const c=e.target.closest('.ed-doc .cbx');
  if(c){c.classList.toggle('on');c.parentElement.classList.toggle('done',c.classList.contains('on'));}
});

function closeAll(){pop.classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');}
document.getElementById('scrim').onclick=closeAll;
addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
document.getElementById('fab').onclick=()=>{
  document.getElementById('sheet').classList.toggle('on');
  document.getElementById('scrim').classList.toggle('on');};
function toggleTheme(){const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  document.querySelector('#theme use').setAttribute('href',d?'#i-moon':'#i-sun');}
document.getElementById('theme').onclick=toggleTheme;
document.getElementById('del').onclick=delNote;
go('home');
</script>
